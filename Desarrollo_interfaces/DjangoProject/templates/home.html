<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center | 125cc Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: white; }
        .card { 
            transition: transform 0.3s; 
            background-color: #2b2b2b; 
            border: none; 
            height: 100%;
        }
        .card:hover { transform: translateY(-10px); }
        .badge-genre { background-color: #0d6efd; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-5 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🎮 SEVILLA GAMING</a>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col text-center">
                <h1 class="display-4 fw-bold">Catálogo de Videojuegos</h1>
                <p class="text-muted">Consumiendo API de FreeToGame para mi proyecto Django + MongoDB</p>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            {% for juego in juegos %}
            <div class="col">
                <div class="card h-100 text-white shadow">
                    <img src="{{ juego.thumbnail }}" class="card-img-top" alt="{{ juego.title }}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold text-truncate">{{ juego.title }}</h5>
                        <span class="badge badge-genre mb-2 w-50">{{ juego.genre }}</span>
                        <p class="card-text small text-secondary">
                            {{ juego.short_description|truncatechars:80 }}
                        </p>
                        <div class="mt-auto">
                            <a href="{{ juego.game_url }}" target="_blank" class="btn btn-outline-primary btn-sm w-100">Ver Juego</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer class="text-center mt-5 py-4 text-muted">
        <p>Proyecto Django 2026 - Sevilla</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

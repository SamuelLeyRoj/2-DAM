<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Free Games Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
        }
        .card {
            background: #111;
            border: 2px solid #0ff;
            border-radius: 15px;
            width: 220px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 10px #0ff;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px #0ff, 0 0 40px #0ff inset;
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-bottom: 2px solid #0ff;
        }
        .card-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            margin: 10px 0;
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }
        .card-text {
            font-size: 12px;
            padding: 0 10px 10px 10px;
            color: #fff;
        }
        .card a {
            display: inline-block;
            margin-bottom: 10px;
            padding: 5px 10px;
            background: #0ff;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
        }
        .card a:hover {
            background: #f0f;
            color: #fff;
            box-shadow: 0 0 10px #f0f, 0 0 20px #f0f inset;
        }
    </style>
</head>
<body>
    <div class="container">
        {% for juego in juegos %}
        <div class="card">
            <img src="{{ juego.imagen }}" alt="{{ juego.titulo }}">
            <h5 class="card-title">{{ juego.titulo }}</h5>
            <p class="card-text">{{ juego.descripcion|truncatechars:80 }}</p>
            <a href="{{ juego.url_juego }}" target="_blank">Jugar</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>

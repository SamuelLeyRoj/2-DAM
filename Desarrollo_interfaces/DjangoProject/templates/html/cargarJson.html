<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Carga de Datos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/cargarJson.css' %}">

    <style>
        /* --- VARIABLES Y ESTILOS DEL NAVBAR --- */
        :root {
            --bg-dark: #0b0c10;
            --neon-red: #dc3545;
            --neon-dim: #a0212d;
            --text-main: #bbb;
            --card-bg: #161616;
        }

        .navbar-custom {
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon-red);
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.3);
        }

        .brand-glow {
            color: var(--neon-red) !important;
            text-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
            font-weight: 800;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom sticky-top mb-4 py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand brand-glow fs-4">SEVILLA GAMING <span style="color:white; font-size: 0.8rem; vertical-align: middle;" class="ms-2 px-2 py-1 bg-danger rounded">ADMIN</span></span>
        <a href="{% url 'principalAdmin' %}" class="btn btn-outline-danger btn-sm px-4 rounded-pill">Volver al Menú</a>
    </div>
</nav>

<div class="container">

    {% if messages %}
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow alert-custom" role="alert">
                        <strong>Estado:</strong> {{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endif %}

    <div class="row justify-content-center g-5">

        <div class="col-md-5">
            <div class="card card-carga p-4 text-center">
                <div class="card-body">
                    <div>
                        <span class="card-icon">📂</span>
                        <h3 class="card-title titulo-cat mb-4">Cargar Categorías</h3>

                    </div>

                    <form method="POST" action="{% url 'importar_categorias_json' %}" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-4 text-start">
                            <label for="fileCat" class="form-label text-secondary small">Selecciona archivo JSON:</label>
                            <input type="file" name="archivo_json" id="fileCat" class="form-control form-control-sm bg-dark text-light border-secondary" accept=".json" required>
                        </div>

                        <button type="submit" class="btn btn-accion btn-cyan shadow">
                            ⬇️ Subir e Importar
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card card-carga p-4 text-center">
                <div class="card-body">
                    <div>
                        <span class="card-icon">🎮</span>
                        <h3 class="card-title titulo-juego mb-4">Cargar Videojuegos</h3>

                    </div>

                    <form method="POST" action="{% url 'importar_juegos_json' %}" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-4 text-start">
                            <label for="fileGames" class="form-label text-secondary small">Selecciona archivo JSON:</label>
                            <input type="file" name="archivo_json" id="fileGames" class="form-control form-control-sm bg-dark text-light border-secondary" accept=".json" required>
                        </div>

                        <button type="submit" class="btn btn-accion btn-red shadow">
                            ⬇️ Subir e Importar
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>



</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/principalAdmin.css' %}">

    <style>
        /* --- VARIABLES Y ESTILOS DEL NAVBAR --- */
        :root {
            --bg-dark: #0b0c10;
            --neon-red: #dc3545;
            --neon-dim: #a0212d;
            --text-main: #bbb;
            --card-bg: #161616;
        }

        .navbar-custom {
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon-red);
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.3);
        }

        .brand-glow {
            color: var(--neon-red) !important;
            text-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
            font-weight: 800;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom sticky-top mb-4 py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand brand-glow fs-4">SEVILLA GAMING <span style="color:white; font-size: 0.8rem; vertical-align: middle;" class="ms-2 px-2 py-1 bg-danger rounded">ADMIN</span></span>
        <a href="{% url 'home' %}" class="btn btn-outline-danger btn-sm px-4 rounded-pill">Volver al Inicio</a>
    </div>
</nav>

<div class="main-container">
    <div class="container">

        <div class="row justify-content-center g-4 mb-4">
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <a href="{% url 'gestionCategoriasAdmin' %}" style="text-decoration: none">
                    <h4 style="color:white;">Gestión de categorías</h4>
                    <div class="panel-icon" style="font-size: 70px">📂</div>
                    </a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <a href="{% url 'estadisticasGlobalesAdmin' %}" style="text-decoration: none">
                    <h4 style="color: white">Stats</h4>
                    <div class="panel-icon" style="font-size: 70px">📊</div>
                    </a>
                </div>
            </div>
        </div>

        <div class="row justify-content-center g-4">
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <a href="{% url 'cargarJson' %}" style="text-decoration: none">
                    <h4 style="color: white">Carga de datos desde fichero</h4>
                    <div class="panel-icon" style="font-size: 70px">⬆️</div>
                    </a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <a href="{% url 'estadisticasGlobalesAdminAdicional' %}" style="text-decoration: none">
                    <h4 style="color: white">Panel de administración</h4>
                    <div class="panel-icon" style="font-size: 70px">🛠️</div>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

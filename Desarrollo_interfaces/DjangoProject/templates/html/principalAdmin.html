<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{% static 'css/principalAdmin.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🎮 SEVILLA GAMING</span>
    </div>
</nav>

<div class="main-container">
    <div class="container">

        <!-- FILA SUPERIOR -->
        <div class="row justify-content-center g-4 mb-4">
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <h4>Gestión de categorías</h4>
                    <div class="panel-icon" style="font-size: 70px">📂</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <h4>Gestión de elementos</h4>
                    <div class="panel-icon" style="font-size: 70px">📦</div>
                </div>
            </div>
        </div>

        <!-- FILA INFERIOR -->
        <div class="row justify-content-center g-4">
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <h4>Carga de datos desde fichero</h4>
                    <div class="panel-icon" style="font-size: 70px">⬆️</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="panel-card" style="display: flex;flex-direction: column">
                    <h4>Panel de administración</h4>
                    <div class="panel-icon" style="font-size: 70px">🛠️</div>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="text-center text-muted py-4">
    Proyecto Django 2026 · Sevilla
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/registroUsuario.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🎮 SEVILLA GAMING</span>
    </div>
</nav>

<div class="main-container">
    <div class="card login-card p-5 shadow-lg">
        <div class="card-body d-flex flex-column">
            <h2 class="text-center fw-bold mb-5 text-light">CREAR CUENTA</h2>

            <form method="POST"> {% csrf_token %}
                <div class="mb-4">
                    <label for="name" class="form-label text-secondary">Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control form-control-dark" id="name"
                           placeholder="Tu nombre" required>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label text-secondary">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control form-control-dark" id="email"
                           placeholder="ejemplo@gaming.com" required>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label text-secondary">Selecciona tu Rol</label>
                    <select name="rol" class="form-select form-control-dark" id="role">
                        <option value="cliente" selected>Usuario Gamer</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary">Contraseña</label>
                    <input type="password" name="password" class="form-control form-control-dark" id="password"
                           placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-outline-secondary btn-login w-100 mt-3 py-2">
                    REGISTRARSE
                </button>
            </form>

            <a href="{% url 'home' %}" class="w-100 mt-3">
                <button class="btn btn-outline-secondary btn-login w-100 py-2">VOLVER</button>
            </a>

            <div class="mt-4 text-center text-secondary">
                ¿Ya tienes cuenta? <a href="{% url 'loginUsuario' %}" class="text-primary fw-bold">Inicia sesión</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

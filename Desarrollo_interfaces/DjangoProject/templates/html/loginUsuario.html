<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🎮 SEVILLA GAMING</span>
    </div>
</nav>

<div class="main-container">
    <div class="card login-card p-5 shadow-lg ">
        <div class="card-body d-flex flex-column">
            <h2 class="text-center fw-bold mb-4 text-light">Iniciar Sesión</h2>

            <div class="mb-3">
                <label for="username" class="form-label text-primary">Usuario</label>
                <input type="text" class="form-control form-control-dark" id="username" placeholder="Tu usuario">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-primary">Contraseña</label>
                <input type="password" class="form-control form-control-dark" id="password" placeholder="••••••••">
            </div>

            <div class="mb-3">
                <label for="confirm-password" class="form-label text-primary">Confirmar Contraseña</label>
                <input type="password" class="form-control form-control-dark" id="confirm-password" placeholder="••••••••">
            </div>

            <button class="btn btn-outline-primary btn-login w-100 mt-3">Entrar</button>

            <div class="mt-3 text-center text-secondary">
                ¿No tienes cuenta? <a href="#" class="text-primary">Regístrate</a>
            </div>
        </div>
    </div>
</div>

<footer class="text-center text-muted py-4 mt-auto">
    Proyecto Django 2026 · Sevilla
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

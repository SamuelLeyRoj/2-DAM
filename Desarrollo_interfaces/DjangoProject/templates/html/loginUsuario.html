<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/loginUsuario.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🎮 SEVILLA GAMING</span>
    </div>
</nav>

<div class="main-container">
    <div class="card login-card p-5 shadow-lg">
        <div class="card-body d-flex flex-column">
            <h2 class="text-center fw-bold mb-5 text-light">INICIAR SESIÓN</h2>

            <form method="POST" action="">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <div class="mb-4">
                    <label for="username" class="form-label text-primary">Correo Electrónico</label>
                    <input type="email" name="username" class="form-control form-control-dark" id="username"
                           placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-primary">Contraseña</label>
                    <input type="password" name="password" class="form-control form-control-dark" id="password"
                           placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-outline-primary mb-2 btn-login w-100 mt-3">
                    Entrar
                </button>
            </form>

            <a href="{% url 'home' %}">
                <button class="btn btn-outline-primary btn-login w-100 mt-3">Volver</button>
            </a>

            <div class="mt-3 text-center text-secondary">
                ¿No tienes cuenta? <a href="{% url 'registroUsuario' %}" class="text-primary">Regístrate</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

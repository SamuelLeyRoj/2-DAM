<!DOCTYPE html>
<html lang="es">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
<link rel="stylesheet" href="{% static 'css/home.css' %}">


</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🎮 LEYTON GAMING</span>
    </div>
</nav>

<div class="container main-container">
    <div class="row justify-content-center g-4">

        <!-- USUARIO -->
        <div class="col-md-5 col-lg-4">
            <div class="card role-card text-center p-4 h-100" style="border: 1px solid #4b4b4b">
                <div class="card-body d-flex flex-column">
                    <div class="icon mb-3">👤</div>
                    <h3 class="text-primary">Usuario</h3>
                    <p class="text-secondary">
                        Explora el catálogo, descubre juegos y disfruta del contenido.
                    </p>
                    <div class="mt-auto">
                        <a href="{% url 'loginUsuario' %}" class="btn btn-outline-primary btn-role w-100">
                            Entrar como Usuario
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- ADMIN -->
        <div class="col-md-5 col-lg-4">
            <div class="card role-card admin-card text-center p-4 h-100" style="border: 1px solid #4b4b4b">
                <div class="card-body d-flex flex-column">
                    <div class="icon mb-3 text-danger">🛠️</div>
                    <h3 class="fw-bold text-danger">Administrador</h3>
                    <p class="text-secondary">
                        Gestiona juegos, usuarios y contenido del sistema.
                    </p>
                    <div class="mt-auto">
                        <a href="{% url 'loginAdmin' %}" class="btn btn-outline-danger btn-role w-100">
                            Acceso Administrador
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="text-center text-muted py-4">
    Proyecto Django 2026 · Sevilla
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

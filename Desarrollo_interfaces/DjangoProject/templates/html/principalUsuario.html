<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Stats Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/principalUsuario.css' %}">

    <style>
        /* --- VARIABLES Y ESTILOS DEL NAVBAR (ESTILO CYAN) --- */
        :root {
            --bg-dark: #0b0c10;
            --neon-blue: #66fcf1;
            --text-main: #c5c6c7;
        }

        .navbar-custom {
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
        }

        .brand-glow {
            color: var(--neon-blue) !important;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
            font-weight: 800;
        }
        
        /* Ajuste para el botón outline basado en el cyan */
        .btn-outline-cyan {
            color: var(--neon-blue);
            border-color: var(--neon-blue);
        }
        .btn-outline-cyan:hover {
            background-color: var(--neon-blue);
            color: #000;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom sticky-top mb-4 py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand brand-glow fs-4">
            SEVILLA GAMING 
            <span style="color:black; font-size: 0.8rem; vertical-align: middle; background-color: var(--neon-blue);" class="ms-2 px-2 py-1 rounded fw-bold">USER</span>
        </span>
        <a href="/" class="btn btn-outline-cyan btn-sm px-4 rounded-pill">Volver al inicio</a>
    </div>
</nav>

<div class="main-container">
    <div class="container">
        <div class="row justify-content-center g-4">

            <div class="col-md-4">
                <div class="panel-card admin">
                    <a href="{% url 'gestionCategoriasRanking' %}" style="text-decoration: none">
                    <h4 style="color: white">Ranking</h4>
                    <div class="panel-icon">🏆</div>
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="panel-card admin position-relative">
                    <a href="{% url 'cargarCategoriasUsuario' %}" style="text-decoration: none">
                    <h4 style="color: white">Review</h4>
                    <div class="panel-icon">📝</div>
                    </a>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="panel-card admin">
                    <a href="{% url 'estadisticasGlobales' %}" style="text-decoration: none">
                        <h4 style="color: white">Stats</h4>
                        <div class="panel-icon">📊</div>
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

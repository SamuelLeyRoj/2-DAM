<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevilla Gaming | Login Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/loginAdmin.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🎮 SEVILLA GAMING <span class="text-danger fs-6 align-middle ms-2">ADMIN</span></span>
    </div>
</nav>

<div class="main-container">
    <div class="card login-card p-5 shadow-lg ">
        <div class="card-body d-flex flex-column">
            <h2 class="text-center fw-bold mb-5 text-light">INICIAR SESIÓN ADMIN</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger p-2 text-center" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="email" class="form-label text-danger">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control form-control-dark" id="email" placeholder="admin@sevillagaming.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-danger">Contraseña</label>
                    <input type="password" name="password" class="form-control form-control-dark" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-outline-danger mb-2 btn-login w-100 mt-3">ENTRAR</button>
            </form>

            <a href="{% url 'home' %}" style="text-decoration: none;">
                <button type="button" class="btn btn-outline-danger btn-login w-100 mt-3">VOLVER</button>
            </a>

            <div class="mt-4 text-center text-secondary">
                ¿No tienes cuenta? <a href="{% url 'registroUsuario' %}" class="text-danger fw-bold">Regístrate</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

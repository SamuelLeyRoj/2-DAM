<nav class="navegacion ">
  <ion-grid>
    <ion-row class="ion-justify-content-between ion-align-items-center ion-flex-nowrap">
      <ion-col  size="auto">
        <ion-button (click)="irDeVuelta()"><img src="assets/img/arrow.png" class="tamanioImagen"></ion-button>
      </ion-col>

      <ion-col size="auto">
        <ion-row class="ion-align-items-center ion-flex-nowrap">
        <ion-col class="ion-display-flex ion-justify-content-center ion-align-items-center">
          <ion-button  (click)="irContactos()"><img src="../../assets/img/arrowChat.webp" class="tamanioImagen"></ion-button>
        </ion-col>
        <ion-col>
          <ion-button (click)="mostrarAlerta()"><img src="../../assets/img/campana.png" class="tamanioImagen"></ion-button>
          <ion-alert
            [isOpen]="mostrar"
            header="Colombia el mejor pais del mundo "
            message="GOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOL"
            [buttons]="['Cancelar', 'Aceptar']"
            (didDismiss)="mostrar = false">
          </ion-alert>
        </ion-col>
        <ion-col>
          <ion-button (click)="irMiCuenta()"><img src="../../assets/img/cuenta.png" class="tamanioImagen"></ion-button>
        </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-grid>
</nav>
